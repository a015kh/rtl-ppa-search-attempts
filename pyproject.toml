[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rtl-ppa-search-attempts"
version = "0.2.0"
description = "RTL PPA prediction and optimization search research attempts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.2,<3", "pandas>=2.3,<3", "scipy>=1.16,<2", "openai>=1.84,<3", "python-dotenv>=1.1,<2", "pyyaml>=6,<7", "tqdm>=4.67,<5"]

[project.optional-dependencies]
ppa = ["torch==2.9.0", "transformers==5.6.0", "datasets==4.3.0", "peft==0.18.1", "huggingface_hub==1.11.0", "accelerate==1.11.0", "ipdb==0.13.13", "matplotlib==3.10.7", "ordered-set==4.1.0", "safetensors==0.6.2", "scikit-learn==1.7.2", "sentencepiece==0.2.1", "tokenizers==0.22.2", "wandb==0.23.0"]
experiments = ["ntloss==0.3.1"]
data = ["datasets==4.3.0"]

dev = ["pytest>=8.4", "pytest-mock>=3.14", "pytest-asyncio>=1.1"]

[project.scripts]
rtl-ppa-search = "revolution.evolve.__main__:main"
rtl-ppa-dataset = "revolution.dataset_generation:main"
rtl-ppa-walkthrough = "revolution.synthetic_walkthrough:main"
rtl-ppa-test-dataset = "revolution.test_dataset_preparation:main"
rtl-ppa-rank-summary = "revolution.rank_evaluation:main"
rtl-ppa-grouped-rank-summary = "revolution.grouped_rank_evaluation:main"
rtl-ppa-verilog-release = "revolution.verilog_release:main"
revolution-evolve = "revolution.evolve.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["revolution*", "text2text_regression*"]

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*.txt"]

[tool.setuptools.package-data]
"revolution.evolve" = ["*.json"]
"revolution" = ["resources/scripts/ref/*", "resources/scripts/util/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
